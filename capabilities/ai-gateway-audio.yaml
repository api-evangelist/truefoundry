naftiko: 1.0.0-alpha2
info:
  label: TrueFoundry AI Gateway API — Audio
  description: 'TrueFoundry AI Gateway API — Audio. 2 operations. Lead operation: Create Speech. Self-contained Naftiko capability
    covering one Truefoundry business surface.'
  tags:
  - Truefoundry
  - Audio
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    TRUEFOUNDRY_API_KEY: TRUEFOUNDRY_API_KEY
capability:
  consumes:
  - type: http
    namespace: ai-gateway-audio
    baseUri: https://app.truefoundry.com/api/llm
    description: TrueFoundry AI Gateway API — Audio business capability. Self-contained, no shared references.
    resources:
    - name: audio-speech
      path: /audio/speech
      operations:
      - name: createspeech
        method: POST
        description: Create Speech
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    - name: audio-transcriptions
      path: /audio/transcriptions
      operations:
      - name: createtranscription
        method: POST
        description: Create Transcription
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    authentication:
      type: bearer
      token: '{{env.TRUEFOUNDRY_API_KEY}}'
  exposes:
  - type: rest
    namespace: ai-gateway-audio-rest
    port: 8080
    description: REST adapter for TrueFoundry AI Gateway API — Audio. One Spectral-compliant resource per consumed operation,
      prefixed with /v1.
    resources:
    - path: /v1/audio/speech
      name: audio-speech
      description: REST surface for audio-speech.
      operations:
      - method: POST
        name: createspeech
        description: Create Speech
        call: ai-gateway-audio.createspeech
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
    - path: /v1/audio/transcriptions
      name: audio-transcriptions
      description: REST surface for audio-transcriptions.
      operations:
      - method: POST
        name: createtranscription
        description: Create Transcription
        call: ai-gateway-audio.createtranscription
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: ai-gateway-audio-mcp
    port: 9090
    transport: http
    description: MCP adapter for TrueFoundry AI Gateway API — Audio. One tool per consumed operation, routed inline through
      this capability's consumes block.
    tools:
    - name: create-speech
      description: Create Speech
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: ai-gateway-audio.createspeech
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
    - name: create-transcription
      description: Create Transcription
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: ai-gateway-audio.createtranscription
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
