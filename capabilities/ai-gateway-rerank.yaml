naftiko: 1.0.0-alpha2
info:
  label: TrueFoundry AI Gateway API — Rerank
  description: 'TrueFoundry AI Gateway API — Rerank. 1 operations. Lead operation: Rerank Documents. Self-contained Naftiko
    capability covering one Truefoundry business surface.'
  tags:
  - Truefoundry
  - Rerank
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    TRUEFOUNDRY_API_KEY: TRUEFOUNDRY_API_KEY
capability:
  consumes:
  - type: http
    namespace: ai-gateway-rerank
    baseUri: https://app.truefoundry.com/api/llm
    description: TrueFoundry AI Gateway API — Rerank business capability. Self-contained, no shared references.
    resources:
    - name: rerank
      path: /rerank
      operations:
      - name: rerankdocuments
        method: POST
        description: Rerank Documents
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    authentication:
      type: bearer
      token: '{{env.TRUEFOUNDRY_API_KEY}}'
  exposes:
  - type: rest
    namespace: ai-gateway-rerank-rest
    port: 8080
    description: REST adapter for TrueFoundry AI Gateway API — Rerank. One Spectral-compliant resource per consumed operation,
      prefixed with /v1.
    resources:
    - path: /v1/rerank
      name: rerank
      description: REST surface for rerank.
      operations:
      - method: POST
        name: rerankdocuments
        description: Rerank Documents
        call: ai-gateway-rerank.rerankdocuments
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: ai-gateway-rerank-mcp
    port: 9090
    transport: http
    description: MCP adapter for TrueFoundry AI Gateway API — Rerank. One tool per consumed operation, routed inline through
      this capability's consumes block.
    tools:
    - name: rerank-documents
      description: Rerank Documents
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: ai-gateway-rerank.rerankdocuments
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
