naftiko: 1.0.0-alpha2
info:
  label: TrueFoundry AI Gateway API — Images
  description: 'TrueFoundry AI Gateway API — Images. 1 operations. Lead operation: Generate Images. Self-contained Naftiko
    capability covering one Truefoundry business surface.'
  tags:
  - Truefoundry
  - Images
  created: '2026-05-19'
  modified: '2026-05-19'
binds:
- namespace: env
  keys:
    TRUEFOUNDRY_API_KEY: TRUEFOUNDRY_API_KEY
capability:
  consumes:
  - type: http
    namespace: ai-gateway-images
    baseUri: https://app.truefoundry.com/api/llm
    description: TrueFoundry AI Gateway API — Images business capability. Self-contained, no shared references.
    resources:
    - name: images-generations
      path: /images/generations
      operations:
      - name: generateimages
        method: POST
        description: Generate Images
        outputRawFormat: json
        outputParameters:
        - name: result
          type: object
          value: $.
        inputParameters:
        - name: body
          in: body
          type: object
          description: Request body (JSON).
          required: true
    authentication:
      type: bearer
      token: '{{env.TRUEFOUNDRY_API_KEY}}'
  exposes:
  - type: rest
    namespace: ai-gateway-images-rest
    port: 8080
    description: REST adapter for TrueFoundry AI Gateway API — Images. One Spectral-compliant resource per consumed operation,
      prefixed with /v1.
    resources:
    - path: /v1/images/generations
      name: images-generations
      description: REST surface for images-generations.
      operations:
      - method: POST
        name: generateimages
        description: Generate Images
        call: ai-gateway-images.generateimages
        with:
          body: rest.body
        outputParameters:
        - type: object
          mapping: $.
  - type: mcp
    namespace: ai-gateway-images-mcp
    port: 9090
    transport: http
    description: MCP adapter for TrueFoundry AI Gateway API — Images. One tool per consumed operation, routed inline through
      this capability's consumes block.
    tools:
    - name: generate-images
      description: Generate Images
      hints:
        readOnly: false
        destructive: false
        idempotent: false
      call: ai-gateway-images.generateimages
      with:
        body: tools.body
      outputParameters:
      - type: object
        mapping: $.
