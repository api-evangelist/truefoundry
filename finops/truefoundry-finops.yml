meters:
  - name: subscription_fee
    description: Monthly tier subscription (Developer free, Pro $499, Pro Plus $2,999, Enterprise custom).
    unit: month
    aggregation: sum
    dimensions:
      - tier
  - name: gateway_requests
    description: Requests routed through the AI Gateway; counts toward each tier's monthly allowance and
      drives overage on Pro.
    unit: request
    aggregation: sum
    dimensions:
      - tier
      - model
      - virtual_key
  - name: seats
    description: Active platform users (3 Developer, 10 Pro, 25 Pro Plus, unlimited Enterprise).
    unit: seat
    aggregation: max
    dimensions:
      - tier
  - name: mcp_tool_calls
    description: MCP gateway tool calls; included up to 5M/month on Pro Plus.
    unit: call
    aggregation: sum
    dimensions:
      - mcp_server
  - name: mcp_servers
    description: Distinct MCP servers configured under the gateway (up to 50 on Pro Plus).
    unit: server
    aggregation: max
principles:
  - name: Visibility
    description: Use the TrueFoundry control center to track gateway request volume, virtual-key spend,
      and per-model usage in real time.
  - name: Allocation
    description: Tag virtual keys by team, environment, and product so gateway requests and overage charges
      can be charged back; group requests by model and route in dashboards.
  - name: Optimization
    description: Lever semantic caching, request routing, and tier selection (Developer for prototyping,
      Pro for production with overage controls, Enterprise for committed-use VPC/on-prem) to keep cost
      per useful inference low.
  - name: Accountability
    description: Assign virtual-key ownership to engineering teams and configure gateway-side rate limits
      and budgets per key; finance reviews the monthly subscription and overage line on the TrueFoundry
      invoice.
