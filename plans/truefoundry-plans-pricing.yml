description: TrueFoundry sells its AI Gateway and MLOps platform as a tiered subscription with a free
  Developer tier and paid Pro, Pro Plus, and Enterprise tiers. Paid plans include a baseline monthly request
  allowance, with usage-based overage charges on Pro. Each tier adds users, governance, and deployment
  options (cloud, VPC, on-prem, air-gapped).
sources:
  - https://www.truefoundry.com/pricing
plans:
  - id: truefoundry-developer
    name: Developer
    type: freemium
    description: Free entry tier for individual developers and evaluation; includes core AI Gateway capabilities
      with a monthly request cap.
    entries:
      - label: Monthly Requests
        name: monthly_requests
        type: quota
        metric: request
        limit: 50000
        timeFrame: month
        geo: global
        unit: 1
        price: '0'
        userMultiplied: false
      - label: Users
        name: users
        type: quota
        metric: seat
        limit: 3
        timeFrame: month
        geo: global
        unit: 1
        price: '0'
        userMultiplied: false
